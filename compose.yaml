services:
  bot:
    build: .
    init: true
    restart: unless-stopped
    environment:
      SOLSTICE_BOT_TOKEN: ${SOLSTICE_BOT_TOKEN:-}
      SOLSTICE_CHAT_CHANNEL_ID: ${SOLSTICE_CHAT_CHANNEL_ID:-}
      SOLSTICE_DISCORD_WEBHOOK_URL: ${SOLSTICE_DISCORD_WEBHOOK_URL:-}
    networks:
      - main-router

networks:
  main-router:
    external: true
